name: Now Playing backdrop focused regression

on:
  pull_request:
    branches: [main]
    paths:
      - css/styles.css
      - e2e/backdrop.spec.ts
      - e2e/helpers/sonance.js
      - .github/workflows/backdrop-focused.yml
  push:
    branches: [fix/nowplaying-backdrop-ci]

permissions:
  contents: read

jobs:
  backdrop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/backdrop.spec.ts --grep "not visible on Now Playing" --retries=0
      - name: Save paired visual captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nowplaying-backdrop-diagnostic
          path: test-results/nowplaying-*.png
          if-no-files-found: warn
          retention-days: 5
